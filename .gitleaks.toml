# TIM secret scan rules. Source of truth: tim-infra deploy/secret-scan/.gitleaks.toml.
# Keep this file identical in every tim-global repo. Passwords and keys live in 1Password; docs name the 1Password item.
# A false positive on one line: add "gitleaks:allow" to that line (in a comment). Never allow a real secret.
title = "TIM secret scan"

[extend]
useDefault = true

[[allowlists]]
description = "Generated, third-party and test files"
paths = [
  '''(^|/)node_modules/''',
  '''(^|/)vendor/''',
  '''(^|/)(dist|build|\.next|coverage)/''',
  '''(^|/)(package-lock\.json|pnpm-lock\.yaml|yarn\.lock|composer\.lock|Cargo\.lock|poetry\.lock|go\.sum)$''',
  '''\.min\.(js|css)$''',
  '''(^|/)\.secrets\.baseline$''',
  '''(^|/)\.gitleaks\.toml$''',
  '''(^|/)(tests?|__tests__|fixtures|testdata)/''',
  '''\.(test|spec)\.[cm]?[jt]sx?$''',
  '''(^|/)test_[^/]*\.py$''',
  '''(^|/)public/email-editor/assets/''',
  '''(^|/)_retired/''',
  '''(^|/)selftest\.php$''',
]

[[allowlists]]
description = "Known non-secret patterns"
regexTarget = "match"
regexes = [
  '''(?i)keys? ?changelog:''',
  '''theme_token''',
  '''oauth_signature=''',
  '''excluded\.(lease_)?token''',
  '''orderKey''',
]

[[allowlists]]
description = "Obvious fakes and plain words"
regexTarget = "secret"
regexes = [
  '''(?i)^(test|not[-_]|fake|dummy|sample|example|dev[-_]?only|ci[-_])''',
  '''^(…|\.\.\.)''',
  '''(?i)^(encrypted|hashed|masked|rotated|stored|redacted|required|protected|unchanged|generated)$''',
]

[[allowlists]]
description = "Asana task and project ids are public numbers, not secrets"
targetRules = ["asana-client-id"]
regexTarget = "secret"
regexes = ['''^[0-9]+$''']

# A Markdown table with a password column. This is how the distributor logins slipped past the old scan.
[[rules]]
id = "tim-password-table"
description = "Markdown table with a password column (keep the password in 1Password and name the item instead)"
regex = '''(?im)^\|[^\n]*\b(?:password|passwd|passcode|pwd)s?\b[^\n]*\|[ \t]*\r?\n\|[ \t:|-]+\|[ \t]*\r?\n((?:\|[^\n]*\|[ \t]*(?:\r?\n|$))+)'''
secretGroup = 1
keywords = ["password", "passwd", "passcode", "pwd"]
[[rules.allowlists]]
regexTarget = "secret"
regexes = ['''(?i)1password|op://''']

# "Password: xyz" / PASSWORD=xyz written in docs, notes, config and env files.
[[rules]]
id = "tim-password-in-text"
description = "Password written in a doc or config file (keep it in 1Password and name the item instead)"
regex = '''(?i)\b(?:password|passwd|passcode|pwd)\b(?:\*\*|__)?[^\S\r\n]*[:=][^\S\r\n]*(?:\*\*|__)?[^\S\r\n]*["'`]?([^\s"'`|<>{}()\[\],;]{6,64})'''
secretGroup = 1
entropy = 2.8
keywords = ["password", "passwd", "passcode", "pwd"]
path = '''(?i)(\.(md|markdown|txt|ya?ml|env|ini|conf|cfg|csv|sql|toml|properties|xml|sh)$|(^|/)\.env[^/]*$)'''
[[rules.allowlists]]
regexTarget = "secret"
regexes = [
  '''(?i)^(changeme|change_me|password\d*|example\S*|placeholder|redacted|your[_-]?\w+|x{3,}|\*+|\.{3,}|null|none|nil|true|false|required|optional|string|hidden|secret|undefined|unknown|unset|empty|blank|same|see|n/a)$''',
  '''^[$%@]''',
  '''(?i)1password|op://|process\.env|getenv|\{\{|env\(''',
]
