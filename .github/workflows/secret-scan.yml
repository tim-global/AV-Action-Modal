name: secret-scan
# Blocks passwords, keys and tokens from reaching the default branch: the "secret-scan" check is required
# by this repository's "Secret scan before merge" ruleset. Same file in every tim-global repo;
# source of truth and how-to: tim-infra docs/runbooks/secret-scan.md. Rules: .gitleaks.toml.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest # public repo: GitHub-hosted is free, and a public repo must never reach the office server
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          dir="$RUNNER_TOOL_CACHE/gitleaks/$GITLEAKS_VERSION"
          if [ ! -x "$dir/gitleaks" ]; then
            tmp="$(mktemp -d)"
            curl -fsSL -o "$tmp/gitleaks.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
            echo "$GITLEAKS_SHA256  $tmp/gitleaks.tgz" | sha256sum -c -
            mkdir -p "$dir" && tar -xzf "$tmp/gitleaks.tgz" -C "$dir" gitleaks && rm -rf "$tmp"
          fi
          echo "$dir" >> "$GITHUB_PATH"
      - name: Scan every file in this revision
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner --exit-code 1
      - name: Scan the commits being added
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then echo "Manual run: file scan only."; exit 0; fi
          if [ -n "$BASE" ] && ! echo "$BASE" | grep -qE '^0+$' && git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            range="${BASE}..${HEAD_SHA}"
          else
            range="${HEAD_SHA} --not origin/${DEFAULT_BRANCH}"
          fi
          echo "Commits scanned: $range"
          gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1 --log-opts="$range"
